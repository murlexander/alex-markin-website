          <h2 class="heading">oxo long shot (soup)</h2>
          <p class="tagline">full-bodied and balanced</p>
          <ul class="links recipe-specs">
            <li class="row" data-recipe-spec="brewer"><span>brewer</span><span class="leader"></span><span class="measure" data-recipe-value="oxo rapid brewer">oxo rapid brewer</span></li>
            <li class="row" data-recipe-spec="coffee"><span>coffee</span><span class="leader"></span><span class="measure" data-recipe-value="13.5">13.5g</span></li>
            <li class="row" data-recipe-spec="water"><span>water</span><span class="leader"></span><span class="measure" data-recipe-value="140">140g</span></li>
            <li class="row" data-recipe-spec="ratio"><span>ratio</span><span class="leader"></span><span class="measure" data-recipe-value="10">∼1:10</span></li>
            <li class="row" data-recipe-spec="temperature"><span>water temperature</span><span class="leader"></span><span class="measure" data-recipe-value="93">∼93℃</span></li>
            <li class="row" data-recipe-spec="grind"><span>grind</span><span class="leader"></span><span class="measure" data-recipe-value="pour-over or finer">pour-over or finer</span></li>
          </ul>
          <h3 class="recipe-subheading">method</h3>
          <ol class="recipe-method">
            <li>put an aeropress paper filter in the basket and damp it</li>
            <li>grind 13.5g of coffee</li>
            <li>put the coffee in the basket and tamp</li>
            <li>optionally, add a metal or paper filter on top as an extra shower screen</li>
            <li>attach the large transparent chamber</li>
            <li>put a paper filter in the larger chamber and damp it</li>
            <li>pour 140g of water at 93℃</li>
            <li>attach the plunger and push slowly</li>
          </ol>
          <p class="recipe-note"><span class="recipe-note-label">note</span>i keep the paper filter in the transparent chamber and change it once in a while.</p>

  </template>
  <template id="preset-iced-filter">

          <h2 class="heading">oxo shot iced</h2>
          <p class="tagline">nice and easy cold coffee</p>
          <ul class="links recipe-specs">
            <li class="row" data-recipe-spec="brewer"><span>brewer</span><span class="leader"></span><span class="measure" data-recipe-value="oxo rapid brewer">oxo rapid brewer</span></li>

          <h3 class="recipe-subheading">method</h3>
          <ol class="recipe-method">
            <li>put an aeropress paper filter in the basket and damp it</li>
            <li>grind 16g of coffee</li>
            <li>put the coffee in the basket and tamp</li>
            <li>optionally, add a metal or paper filter on top as an extra shower screen</li>
            <li>attach the large transparent chamber</li>
            <li>put a paper filter in the larger chamber and damp it</li>
            <li>pour 130g of water at 94℃</li>
            <li>attach the plunger and push slowly</li>
          </ol>
          <p class="recipe-note"><span class="recipe-note-label">note</span>i keep the paper filter in the transparent chamber and change it once in a while.</p>

  </template>
  <template id="preset-aeropress">

          <h2 class="heading">aeropress inverted</h2>
          <ul class="links recipe-specs">
            <li class="row" data-recipe-spec="brewer"><span>brewer</span><span class="leader"></span><span class="measure" data-recipe-value="aeropress, inverted">aeropress, inverted</span></li>
            <li class="row" data-recipe-spec="coffee"><span>coffee</span><span class="leader"></span><span class="measure" data-recipe-value="12">12g</span></li>
            <li class="row" data-recipe-spec="water"><span>water</span><span class="leader"></span><span class="measure" data-recipe-value="200">200g</span></li>
            <li class="row" data-recipe-spec="ratio"><span>ratio</span><span class="leader"></span><span class="measure" data-recipe-value="16.6">1:16.6</span></li>
            <li class="row" data-recipe-spec="temperature"><span>water temperature</span><span class="leader"></span><span class="measure" data-recipe-value="80–83">80–83℃</span></li>
            <li class="row" data-recipe-spec="grind"><span>grind</span><span class="leader"></span><span class="measure" data-recipe-value="slightly finer than pour-over">slightly finer than pour-over</span></li>
          </ul>
          <h3 class="recipe-subheading">method</h3>
          <ol class="recipe-method">
            <li>set up the aeropress inverted so it stands on the plunger</li>
            <li>put a paper filter in the basket and damp it</li>
            <li>put the coffee in the aeropress chamber</li>
            <li><span class="recipe-time">0:00</span>pour in 200g as fast as the kettle allows</li>
            <li><span class="recipe-time">0:30</span>stir the grounds slightly and put the filter on</li>
            <li><span class="recipe-time">0:45</span>invert the aeropress and place it on a cup or server</li>
            <li><span class="recipe-time">1:15</span>start pushing slowly</li>
            <li><span class="recipe-time">2:00</span>finish the push, avoiding the hiss at the end</li>
          </ol>
          <p class="recipe-note"><span class="recipe-note-label">note</span>i recommend against using a metal filter alone; it produces a lot of mud and fogginess in the cup.</p>

  </template>

          <h3 class="recipe-subheading">method</h3>
          <ol class="recipe-method">
            <li>damp the filter and check it sits well</li>
            <li><span class="recipe-time">0:00</span>pour <span data-recipe-calculation="bloom"></span> with high agitation</li>
            <li><span class="recipe-time">1:00</span>pour <span data-recipe-calculation="remaining-half"></span> round to center</li>
            <li><span class="recipe-time">1:30</span>pour <span data-recipe-calculation="remaining-half"></span> round to center and swirl</li>
          </ol>

  </template>
