<style>
  :root {
    /* --- what the backgrounds are made of. the panel writes these. --- */
    --m1: #e0794f;        /* the three mesh blobs      */
    --m2: #3a5684;
    --m3: #783c6e;
    --mesh-alpha: .30;    /* blob strength             */
    --mesh-size: 1;       /* blob radius multiplier    */
    --mesh-blur: 28px;
    --mesh-b: .65;        /* second layer's opacity    */
    --drift-a: 26s;       /* the two drift periods,    */
    --drift-b: 37s;       /* counter-phase             */
    --drift-amp: .14;     /* how far the drift zooms   */
    --grain-alpha: .16;
    --grain-rate: 700ms;  /* resample interval         */
  }
  html, body { height: 100%; }
  body { --note-width: 30rem; overflow: hidden; }

  /* --- the stage: independently controlled effects over pure black --- */
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    contain: paint;
    background: var(--bg);
  }
  .fx {
    position: absolute;
    inset: 0;
    opacity: 1;
    visibility: visible;
    transition: opacity 600ms ease, visibility 0s;
  }
  .fx[data-disabled] {
    opacity: 0;
    visibility: hidden;
    transition: opacity 600ms ease, visibility 0s 600ms;
  }

  /* mesh: overlapping radials, slowly drifting */
  .mesh::before, .mesh::after {
    content: "";
    position: absolute;
    inset: -25%;
    background:
      radial-gradient(calc(38% * var(--mesh-size)) calc(38% * var(--mesh-size)) at 28% 32%,
        color-mix(in srgb, var(--m1) calc(var(--mesh-alpha) * 100%), transparent), transparent 70%),
      radial-gradient(calc(42% * var(--mesh-size)) calc(42% * var(--mesh-size)) at 72% 66%,
        color-mix(in srgb, var(--m2) calc(var(--mesh-alpha) * 100%), transparent), transparent 70%),
      radial-gradient(calc(34% * var(--mesh-size)) calc(34% * var(--mesh-size)) at 62% 22%,
        color-mix(in srgb, var(--m3) calc(var(--mesh-alpha) * 73%), transparent), transparent 70%);
    filter: blur(var(--mesh-blur));
    animation: drift var(--drift-a) ease-in-out infinite alternate;
  }
  .mesh::after {
    animation-duration: var(--drift-b);
    animation-direction: alternate-reverse;
    opacity: var(--mesh-b);
  }
  @keyframes drift {
    from { transform: translate3d(-4%, -3%, 0) scale(1); }
    to   { transform: translate3d(5%, 4%, 0) scale(calc(1 + var(--drift-amp))); }
  }

  /* grain: fractal noise; transparent, so it can sit on top of the mesh.
     the tile is built in js, since baseFrequency lives inside the data uri. */
  .grain::before {
    content: "";
    position: absolute;
    /* 20% is enough overscan for the 3% stepped translations. The previous
       100% inset made this composited surface nine times the viewport area. */
    inset: -20%;
    background-image: var(--grain-url);
    opacity: var(--grain-alpha);
    animation: shift var(--grain-rate) steps(1) infinite;
  }
  @keyframes shift {
    0%   { transform: translate3d(0, 0, 0); }
    25%  { transform: translate3d(-3%, 2%, 0); }
    50%  { transform: translate3d(2%, -3%, 0); }
    75%  { transform: translate3d(-2%, -2%, 0); }
    100% { transform: translate3d(3%, 1%, 0); }
  }

  /* --- chrome --- */
  .chrome {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem clamp(1.5rem, 5vw, 3.5rem);
    pointer-events: none;
  }
  .chrome a { pointer-events: auto; }
  .top, .bottom { display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem; }
  /* --- effect-specific panel states --- */
  .effect-section + .effect-section {
    border-top: 1px solid var(--line);
    margin-top: .8rem;
    padding-top: .15rem;
  }
  .effect-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 1;
  }
  .effect-head .effect-name {
    margin: 0;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    opacity: .65;
  }
  .panel .effect-toggle {
    min-width: 2.5rem;
    color: var(--accent);
    border-color: var(--accent);
  }
  .panel .effect-toggle[aria-pressed="false"] {
    color: var(--muted);
    border-color: var(--line);
  }
  .effect-section .ctrl { transition: opacity 180ms ease; }
  .effect-section[data-disabled] .ctrl { opacity: .3; }
  .effect-section[data-disabled] input { cursor: not-allowed; }
  /* disabled effects should not keep animating invisibly */
  .fx[data-disabled]::before, .fx[data-disabled]::after { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) {
    .fx, .mesh::before, .mesh::after, .grain::before {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<body>
  <div class="stage" id="stage">
    <div class="fx mesh" id="meshFx" aria-hidden="true"></div>
    <div class="fx grain" id="grainFx" aria-hidden="true"></div>
  </div>

  <div class="chrome">
    <div class="top">
      <a class="back" href="../">← trials</a>
    </div>
    <div class="bottom">
      <div>
        <h1 class="trial-heading">background</h1>
        <p class="note">mesh and grain, composed from the panel.</p>
      </div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="background controls">
    <div class="panel-head">
      <span class="title">background</span>
      <button id="reset" type="button">reset</button>
      <button id="fold" type="button" aria-expanded="true">hide</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

<script src="../_shared/trial-ui.js?v=20260804-1"></script>
<script>
  // ---- panel ------------------------------------------------------------
  const EFFECTS = [
    { k:"mesh",  l:"mesh",  def:true, el:document.getElementById("meshFx") },
    { k:"grain", l:"grain", def:true, el:document.getElementById("grainFx") }
  ];
  const PARAMS = [
    { g:"mesh",  k:"mesh-blur",   l:"blur",        min:0,  max:90,  step:1,   def:28,  u:"px", css:"px" },
    { g:"mesh",  k:"mesh-size",   l:"blob size",   min:.3, max:2.5, step:.05, def:1,   u:"×"  },
    { g:"mesh",  k:"mesh-alpha",  l:"strength",    min:0,  max:.9,  step:.01, def:.30, u:""   },
    { g:"mesh",  k:"mesh-b",      l:"2nd layer",   min:0,  max:1,   step:.01, def:.65, u:""   },
    { g:"mesh",  k:"drift-a",     l:"drift a",     min:3,  max:90,  step:1,   def:26,  u:"s", css:"s" },
    { g:"mesh",  k:"drift-b",     l:"drift b",     min:3,  max:90,  step:1,   def:37,  u:"s", css:"s" },
    { g:"mesh",  k:"drift-amp",   l:"drift zoom",  min:0,  max:.8,  step:.01, def:.14, u:""   },
    { g:"grain", k:"grain-alpha", l:"strength",    min:0,  max:.6,  step:.01, def:.16, u:""   },
    { g:"grain", k:"grain-rate",  l:"resample",    min:60, max:3000,step:20,  def:700, u:"ms", css:"ms" },
    { g:"grain", k:"freq",        l:"frequency",   min:.05,max:2,   step:.05, def:.85, u:""   },
    { g:"grain", k:"oct",         l:"octaves",     min:1,  max:5,   step:1,   def:3,   u:""   }
  ];
  const COLOURS = [
    { g:"mesh", k:"m1", l:"blob 1", def:"#e0794f" },
    { g:"mesh", k:"m2", l:"blob 2", def:"#3a5684" },
    { g:"mesh", k:"m3", l:"blob 3", def:"#783c6e" }
  ];

  const root = document.documentElement;
  const panel = document.getElementById("panel");
  const panelBody = document.getElementById("panelBody");
  const ui = {};
  const CFG = {};
  const paramsByKey = new Map(PARAMS.map(p => [p.k, p]));
  let grainFrame = 0;
  for (const effect of EFFECTS) CFG[effect.k + "Enabled"] = effect.def;
  for (const p of PARAMS) CFG[p.k] = p.def;
  for (const c of COLOURS) CFG[c.k] = c.def;

  // baseFrequency and numOctaves live inside the noise tile's data uri, so the
  // tile has to be rebuilt whenever either moves
  function grainTile() {
    grainFrame = 0;
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'>" +
      "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='" + CFG.freq +
      "' numOctaves='" + CFG.oct + "' stitchTiles='stitch'/></filter>" +
      "<rect width='240' height='240' filter='url(#n)'/></svg>";
    root.style.setProperty("--grain-url", 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
  }

  function scheduleGrainTile() {
    if (!grainFrame) grainFrame = requestAnimationFrame(grainTile);
  }

  function apply(k) {
    if (k === "freq" || k === "oct") { scheduleGrainTile(); return; }
    const p = paramsByKey.get(k);
    root.style.setProperty("--" + k, CFG[k] + (p && p.css ? p.css : ""));
  }

  for (const effect of EFFECTS) {
    const section = document.createElement("section");
    section.className = "effect-section";
    section.dataset.effect = effect.k;
    section.setAttribute("aria-labelledby", effect.k + "Controls");

    const head = document.createElement("div");
    head.className = "group effect-head";

    const effectName = document.createElement("h2");
    effectName.id = effect.k + "Controls";
    effectName.className = "effect-name";
    effectName.textContent = effect.l;

    const toggle = document.createElement("button");
    toggle.className = "effect-toggle";
    toggle.type = "button";
    toggle.setAttribute("aria-label", "turn " + effect.l + " off");
    toggle.setAttribute("aria-pressed", "true");
    toggle.textContent = "on";

    head.append(effectName, toggle);
    section.appendChild(head);

    ui[effect.k + "Enabled"] = { toggle, section, effect };
    toggle.addEventListener("click", () => {
      const key = effect.k + "Enabled";
      CFG[key] = !CFG[key];
      syncEffect(effect);
    });

    for (const p of PARAMS.filter(p => p.g === effect.k)) {
      ui[p.k] = TrialUI.addRange(section, p, value => {
        CFG[p.k] = value;
        apply(p.k);
      }, effect.l);
    }

    for (const c of COLOURS.filter(c => c.g === effect.k)) {
      ui[c.k] = TrialUI.addColor(section, c, value => {
        CFG[c.k] = value;
        root.style.setProperty("--" + c.k, value);
      }, effect.l);
    }

    panelBody.appendChild(section);
  }

  function syncEffect(effect) {
    const enabled = CFG[effect.k + "Enabled"];
    const effectUI = ui[effect.k + "Enabled"];
    effect.el.toggleAttribute("data-disabled", !enabled);
    effectUI.section.toggleAttribute("data-disabled", !enabled);
    effectUI.toggle.setAttribute("aria-pressed", String(enabled));
    effectUI.toggle.setAttribute("aria-label", "turn " + effect.l + (enabled ? " off" : " on"));
    effectUI.toggle.textContent = enabled ? "on" : "off";
    effectUI.section.querySelectorAll("input").forEach(input => { input.disabled = !enabled; });
  }

  // browsers restore form state on reload and bfcache, which would leave the
  // widgets showing one thing while the page is drawn from another
  function syncUI() {
    for (const effect of EFFECTS) syncEffect(effect);
    for (const p of PARAMS) {
      TrialUI.setRange(ui[p.k], CFG[p.k]);
      apply(p.k);
    }
    for (const c of COLOURS) {
      TrialUI.setColor(ui[c.k], CFG[c.k]);
      root.style.setProperty("--" + c.k, CFG[c.k]);
    }
  }

  document.getElementById("reset").addEventListener("click", () => {
    for (const effect of EFFECTS) CFG[effect.k + "Enabled"] = effect.def;
    for (const p of PARAMS) CFG[p.k] = p.def;
    for (const c of COLOURS) CFG[c.k] = c.def;
    syncUI();
  });

  TrialUI.bindPanelFold(panel, document.getElementById("fold"));

  window.addEventListener("pageshow", syncUI);
  syncUI();
</script>
  <script src="/privacy.js?v=20260926-1"></script>
</body>
