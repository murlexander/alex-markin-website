<style>
  html, body { height: 100%; }
  body { --note-width: 32rem; overflow: hidden; }
  /* the field carries its own pointer, so hide the real one — but only where
     there is a real one to hide, and never over the panel, where you need it */
  @media (hover: hover) and (pointer: fine) {
    body, .chrome a { cursor: none; }
    .panel, .panel * { cursor: auto; }
    .panel input, .panel button { cursor: pointer; }
    .panel input[type=text] { cursor: text; }
  }

  #field {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* --- chrome --- */
  .chrome {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem clamp(1.5rem, 5vw, 3.5rem);
    pointer-events: none;
  }
  .chrome a { pointer-events: auto; }
  .top, .bottom { display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem; }
  /* keep the text legible over the field */
  .top    { text-shadow: 0 0 12px var(--bg), 0 0 4px var(--bg); }
  .bottom { text-shadow: 0 0 16px var(--bg), 0 0 6px var(--bg), 0 0 2px var(--bg); }
  .trial, .hint {
    font-family: var(--mono);
    font-size: .85rem;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .hint { font-size: .8rem; letter-spacing: .1em; white-space: nowrap; }
  @media (max-width: 34rem) {
    .hint { display: none; }
  }

<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <div class="chrome">
    <div class="top">
      <a class="back" href="../">← trials</a>
      <span class="trial">mouse responsive</span>
    </div>
    <div class="bottom">
      <div>
        <h1 class="trial-heading">glyph field</h1>
        <p class="note">a glyph grid that shifts shape and glow around the pointer.</p>
      </div>
      <span class="hint">move the pointer</span>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="field controls">
    <div class="panel-head">
      <span class="title">field</span>
      <button id="reset" type="button">reset</button>
      <button id="fold" type="button" aria-expanded="true">hide</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

<script src="../_shared/trial-ui.js?v=20260804-1"></script>
<script>
(() => {
  // ---- parameters -------------------------------------------------------
  const PARAMS = [
    { g:"grid",    k:"cell",  l:"cell size",  min:10, max:60,  step:1,   def:24,  u:"px" },
    { g:"grid",    k:"font",  l:"glyph size", min:5,  max:36,  step:1,   def:15,  u:"px" },
    { g:"field",   k:"reach", l:"reach",      min:30, max:600, step:10,  def:170, u:"px" },
    { g:"field",   k:"fall",  l:"falloff",    min:.4, max:4,   step:.1,  def:2,   u:""   },
    { g:"field",   k:"rest",  l:"rest alpha", min:0,  max:.6,  step:.01, def:.15, u:""   },
    { g:"field",   k:"peak",  l:"peak alpha", min:.2, max:1,   step:.02, def:1,   u:""   },
    { g:"glow",    k:"warm",  l:"amount",     min:0,  max:1,   step:.02, def:1,   u:""   },
    { g:"pointer", k:"ring",  l:"ring",       min:0,  max:.6,  step:.02, def:0,   u:""   }
  ];
  const GLOW_TOGGLE = { k:"glowOn", l:"enabled", def:true };
  const GLOW_COLOR = { k:"glowColor", l:"color", def:"#e0794f" };
  const GLYPHS = [
    { k:"far",  l:"at rest",  def:"-" },
    { k:"near", l:"in reach", def:"+" }
  ];

  const CFG = {};
  for (const p of PARAMS) CFG[p.k] = p.def;
  CFG[GLOW_TOGGLE.k] = GLOW_TOGGLE.def;
  CFG[GLOW_COLOR.k] = GLOW_COLOR.def;
  for (const g of GLYPHS) CFG[g.k] = g.def;

  const REST_RGB = [240, 238, 232];   // the dash colour, matches --fg
  function hexToRgb(hex) {
    const value = Number.parseInt(hex.slice(1), 16);
    return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
  }
  let glowRGB = hexToRgb(CFG.glowColor);

  // ---- canvas -----------------------------------------------------------
  const canvas = document.getElementById("field");
  const ctx = canvas.getContext("2d");
  const monoStack = getComputedStyle(document.documentElement).getPropertyValue("--mono");

  let w = 0, h = 0, dpr = 1;
  let px = -1e4, py = -1e4;         // current pointer
  let lastX = -1e4, lastY = -1e4;   // where we last painted, for the dirty rect
  let paintFrame = 0, resizeFrame = 0, needsFullPaint = false;

  function setFont() { ctx.font = CFG.font + "px " + monoStack; ctx.textAlign = "center"; ctx.textBaseline = "middle"; }

  function resize() {
    if (paintFrame) cancelAnimationFrame(paintFrame);
    paintFrame = 0;
    needsFullPaint = false;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    setFont();
    if (px < -1e3) { px = w / 2; py = h / 2; }   // sit in the middle until the pointer arrives
    full();
  }

  // paint every cell the given rect touches. the clear is snapped out to whole
  // cells first: clearing the raw rect would leave the fringe cells getting a
  // second, additive pass, which paints a brighter trail behind the pointer.
  function paint(x0, y0, x1, y1) {
    const cell = CFG.cell, R = CFG.reach;
    const R2 = R * R;
    const c0 = Math.max(0, Math.floor(x0 / cell));
    const c1 = Math.min(Math.ceil(w / cell) - 1, Math.floor(x1 / cell));
    const r0 = Math.max(0, Math.floor(y0 / cell));
    const r1 = Math.min(Math.ceil(h / cell) - 1, Math.floor(y1 / cell));
    ctx.clearRect(c0 * cell, r0 * cell, (c1 - c0 + 1) * cell, (r1 - r0 + 1) * cell);

    const restStyle = "rgba(" + REST_RGB.join(",") + "," + CFG.rest + ")";
    for (let r = r0; r <= r1; r++) {
      const cy = r * cell + cell / 2;
      for (let c = c0; c <= c1; c++) {
        const cx = c * cell + cell / 2;
        const dx = cx - px, dy = cy - py;
        const d2 = dx * dx + dy * dy;
        if (d2 > R2) {
          ctx.fillStyle = restStyle;
          ctx.fillText(CFG.far, cx, cy);
        } else {
          // ease so the edge of the field dissolves instead of ending on a disc
          const e = Math.pow(1 - Math.sqrt(d2) / R, CFG.fall);
          const m = e * CFG.warm * (CFG.glowOn ? 1 : 0);
          ctx.fillStyle = "rgba(" +
            Math.round(REST_RGB[0] + (glowRGB[0] - REST_RGB[0]) * m) + "," +
            Math.round(REST_RGB[1] + (glowRGB[1] - REST_RGB[1]) * m) + "," +
            Math.round(REST_RGB[2] + (glowRGB[2] - REST_RGB[2]) * m) + "," +
            (CFG.rest + (CFG.peak - CFG.rest) * e).toFixed(3) + ")";
          ctx.fillText(CFG.near, cx, cy);
        }
      }
    }
  }

  // the pointer: the ring shows the reach, the crosshair marks the exact spot
  function drawPointer() {
    const pointerRGB = CFG.glowOn ? glowRGB : REST_RGB;
    const pointerColor = pointerRGB.join(",");
    if (CFG.ring > 0) {
      ctx.beginPath();
      ctx.arc(px, py, CFG.reach, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(" + pointerColor + "," + CFG.ring + ")";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(px - 9, py); ctx.lineTo(px - 3, py);
    ctx.moveTo(px + 3, py); ctx.lineTo(px + 9, py);
    ctx.moveTo(px, py - 9); ctx.lineTo(px, py - 3);
    ctx.moveTo(px, py + 3); ctx.lineTo(px, py + 9);
    ctx.strokeStyle = "rgba(" + pointerColor + ",.9)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // repaint only the old and new influence regions
  function flush() {
    const pad = CFG.reach + CFG.cell * 2;
    const separated = Math.abs(px - lastX) > pad * 2 || Math.abs(py - lastY) > pad * 2;
    if (separated) {
      // A large pointer jump creates two small dirty regions. Painting the
      // corridor between them can otherwise approach a full-canvas repaint.
      paint(Math.max(0, lastX - pad), Math.max(0, lastY - pad),
            Math.min(w, lastX + pad), Math.min(h, lastY + pad));
      paint(Math.max(0, px - pad), Math.max(0, py - pad),
            Math.min(w, px + pad), Math.min(h, py + pad));
    } else {
      paint(Math.max(0, Math.min(px, lastX) - pad), Math.max(0, Math.min(py, lastY) - pad),
            Math.min(w, Math.max(px, lastX) + pad), Math.min(h, Math.max(py, lastY) + pad));
    }
    drawPointer();
    lastX = px; lastY = py;
  }

  // a parameter changed, so the whole grid is stale
  function full() {
    paint(0, 0, w, h);
    drawPointer();
    lastX = px; lastY = py;
  }

  function schedulePaint(fullPaint = false) {
    needsFullPaint ||= fullPaint;
    if (paintFrame) return;
    paintFrame = requestAnimationFrame(() => {
      paintFrame = 0;
      if (needsFullPaint) {
        needsFullPaint = false;
        full();
      } else {
        flush();
      }
    });
  }

  function scheduleFull() {
    schedulePaint(true);
  }

  function move(e) {
    px = e.clientX; py = e.clientY;
    schedulePaint();
  }

  function scheduleResize() {
    if (resizeFrame) return;
    resizeFrame = requestAnimationFrame(() => {
      resizeFrame = 0;
      resize();
    });
  }

  // ---- panel ------------------------------------------------------------
  const body = document.getElementById("panelBody");
  const panel = document.getElementById("panel");
  const ui = {};
  let lastGroup = null;

  for (const p of PARAMS) {
    if (p.g !== lastGroup) {
      TrialUI.addGroup(body, p.g);
      lastGroup = p.g;
      if (p.g === "glow") {
        ui[GLOW_TOGGLE.k] = TrialUI.addToggle(body, GLOW_TOGGLE, value => {
          CFG[GLOW_TOGGLE.k] = value;
          setGlowAvailability();
          scheduleFull();
        });
        ui[GLOW_COLOR.k] = TrialUI.addColor(body, GLOW_COLOR, value => {
          CFG[GLOW_COLOR.k] = value;
          glowRGB = hexToRgb(value);
          scheduleFull();
        });
      }
    }
    ui[p.k] = TrialUI.addRange(body, p, value => {
      CFG[p.k] = value;
      if (p.k === "font") setFont();
      scheduleFull();
    });
  }

  TrialUI.addGroup(body, "glyphs");

  for (const g of GLYPHS) {
    ui[g.k] = TrialUI.addText(body, g, value => {
      CFG[g.k] = value === "" ? " " : value;
      scheduleFull();
    });
  }

  // push CFG back into the widgets. browsers restore form state on reload and
  // bfcache, which would otherwise leave the sliders showing one thing while
  // the field is drawn from another.
  function setGlowAvailability() {
    for (const control of [ui[GLOW_COLOR.k], ui.warm]) {
      control.input.disabled = !CFG[GLOW_TOGGLE.k];
      control.wrap.toggleAttribute("data-disabled", !CFG[GLOW_TOGGLE.k]);
    }
  }

  function syncUI() {
    for (const p of PARAMS) {
      TrialUI.setRange(ui[p.k], CFG[p.k]);
    }
    TrialUI.setToggle(ui[GLOW_TOGGLE.k], CFG[GLOW_TOGGLE.k]);
    TrialUI.setColor(ui[GLOW_COLOR.k], CFG[GLOW_COLOR.k]);
    glowRGB = hexToRgb(CFG[GLOW_COLOR.k]);
    setGlowAvailability();
    for (const g of GLYPHS) TrialUI.setText(ui[g.k], CFG[g.k]);
  }

  document.getElementById("reset").addEventListener("click", () => {
    for (const p of PARAMS) CFG[p.k] = p.def;
    CFG[GLOW_TOGGLE.k] = GLOW_TOGGLE.def;
    CFG[GLOW_COLOR.k] = GLOW_COLOR.def;
    for (const g of GLYPHS) CFG[g.k] = g.def;
    syncUI();
    setFont();
    scheduleFull();
  });

  window.addEventListener("pageshow", syncUI);

  TrialUI.bindPanelFold(panel, document.getElementById("fold"));

  window.addEventListener("pointermove", move, { passive: true });
  window.addEventListener("pointerdown", move, { passive: true });
  window.addEventListener("resize", scheduleResize);
  syncUI();
  resize();

  // Canvas text does not redraw itself when a web font finishes loading.
  // Repaint once so the field always settles on the same mono face as the UI.
  if (document.fonts) {
    document.fonts.ready.then(() => {
      setFont();
      scheduleFull();
    });
  }
})();
</script>
  <script src="/privacy.js?v=20260926-1"></script>
</body>
</html>
